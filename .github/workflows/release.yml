# Release: builds the packaged OpenHogs for Windows and Linux and attaches
# the archives to a GitHub release.
#
# It runs when a version tag is pushed (git tag v0.1.0 && git push origin
# v0.1.0), and can be started by hand from the Actions tab
# ("Run workflow") to get the archives as downloadable artifacts without
# publishing a release. Ordinary pushes and pull requests do not run it:
# the checks of every change stay in build.yml, on pull requests only.
#
# Each archive is made by CPack (cmake/OpenHogsPackaging.cmake) after the
# unit tests pass. The Linux job is allowed to fail on its own (its package
# servers kept hanging in November 2026): the release then carries the
# Windows archive alone.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # to create the release and upload its files

jobs:
  package:
    name: Package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            optional: false
            configure: cmake -S . -B build -A x64 -DOPENHOGS_WARNINGS_AS_ERRORS=ON
          - name: Linux
            os: ubuntu-latest
            optional: true
            configure: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DOPENHOGS_WARNINGS_AS_ERRORS=ON

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxss-dev libxtst-dev libxfixes-dev libxkbcommon-dev libwayland-dev libegl-dev \
            libgl-dev libdrm-dev libgbm-dev

      - name: Configure
        run: ${{ matrix.configure }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        working-directory: build
        run: cpack -C Release

      - name: Keep the archive
        uses: actions/upload-artifact@v4
        with:
          name: OpenHogs-${{ matrix.name }}
          path: |
            build/OpenHogs-*.zip
            build/OpenHogs-*.tar.gz
          if-no-files-found: error

  release:
    name: Publish the release
    needs: package
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the archives
        uses: actions/download-artifact@v4
        with:
          path: archives
          merge-multiple: true

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          name: OpenHogs ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: archives/*
          fail_on_unmatched_files: true
