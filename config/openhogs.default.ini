; OpenHogs configuration
;
; Copy this file to "openhogs.ini" in the same folder and edit the copy.
; Relative paths are relative to this "config" folder.

[Game]
; Folder of your Hogs of War installation (Steam or GOG).
; Steam default:
Directory = C:\Program Files (x86)\Steam\steamapps\common\HogsofWar
; GOG example:
; Directory = C:\GOG Games\Hogs of War

[Content]
; Folder that contains the content packs.
PacksDirectory = ../content/packs

; Language of text and speech.
;   en = original English files (no pack needed)
;   any other code needs a language pack with that Language, e.g. "it"
Language = en

; Optional packs to switch on, by Id, separated by commas.
; Remove an Id from the list to switch that pack off.
; Example: EnabledPacks = hd-music, ps1-difficulty
EnabledPacks =

[Audio]
; Volumes from 0 (silent) to 100 (as recorded). The final volume of a sound
; is its category volume multiplied by the master volume.
MasterVolume = 100
EffectsVolume = 100
SpeechVolume = 100
MusicVolume = 100
