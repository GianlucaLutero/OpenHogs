; OpenHogs configuration
;
; Copy this file to "openhogs.ini" in the same folder and edit the copy.
; Relative paths are relative to this "config" folder.

[Game]
; Folder of your Hogs of War installation (Steam or GOG).
; Steam default:
Directory = C:\Program Files (x86)\Steam\steamapps\common\HogsofWar
; GOG example:
; Directory = C:\GOG Games\Hogs of War

; Whose rules to follow where the releases differ:
;   pc  = the PC release (computer hogs never walk, turn tunes play once)
;   ps1 = the PlayStation, the default (computer hogs walk to better places, turn tunes
;         loop, and winning the campaign starts the hard mode: again from
;         mission 1 with every enemy one rank higher)
Version = ps1

[Content]
; Folder that contains the content packs.
PacksDirectory = ../content/packs

; Language of text and speech.
;   en = original English files (no pack needed)
;   any other code needs a language pack with that Language, e.g. "it"
Language = en

; Optional packs to switch on, by Id, separated by commas.
; Remove an Id from the list to switch that pack off.
; Example: EnabledPacks = hd-music, ps1-difficulty
EnabledPacks =

[Audio]
; Volumes from 0 (silent) to 100 (as recorded), also changed in the game
; (OPTIONS -> AUDIO), which saves them here. The final volume of a sound
; is its category volume multiplied by the master volume.
MasterVolume = 100
EffectsVolume = 100
SpeechVolume = 100
MusicVolume = 100
; The original's MODE: mono (both channels mixed), stereo or surround
; (the PC version plays surround as stereo). Also set in VOLUME CONTROL.
SoundMode = stereo

[Controls]
; The keys of a match, also changed in the game: OPTIONS -> CONTROLS (pick
; a row, then press its new key). Names of physical keys, as on a US
; keyboard, separated by commas: W, Up, Left Ctrl, Space, Return, Tab...
; A control left out or empty keeps these defaults. Esc always pauses.
Forward = W, Up
Backward = S, Down
TurnLeft = A, Left
TurnRight = D, Right
Fire = Left Ctrl, X
Jump = Space
PreviousWeapon = Q
NextWeapon = E
Sight = V
AimDown = F
AimUp = R
NextHog = Tab
EndTurn = Return
Pause = P
