; Template for a new content pack.
;
; 1. Copy this "_template" folder and rename the copy (e.g. "hd-music").
;    Folders starting with "_" are ignored, so the copy must not keep it.
; 2. Edit the values below.
; 3. Put the replacement files in the "data" folder, using the same
;    folder structure as the game installation.
; 4. Add the Id to EnabledPacks in config/openhogs.ini
;    (language packs are activated with Language = <code> instead).

[Pack]
Id          = my-pack
Name        = My pack
; language | audio | music | textures | maps | misc
Type        = misc
; Only for Type = language:
; Language  = it
Priority    = 0
Author      =
Version     = 1.0
Description = What this pack changes.
