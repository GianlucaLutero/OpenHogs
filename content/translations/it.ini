; Italian translation overrides for openhogs-langpack.
;
; Most Italian text comes from your own PlayStation disc. These lines cover
; the strings the PlayStation version does not have or words differently
; for the PC: tutorial hints that name keyboard keys instead of pad
; buttons, key names, network game menus and some credit titles.
;
; This is original text written for OpenHogs, so it can be shared and
; improved. Format: [table] then "<PC string index> = <text>". Accented
; capitals are written normally (À È É Ì Ò Ù); the font is upper case only.
; Run openhogs-text export on the PC tables to see the English originals.

